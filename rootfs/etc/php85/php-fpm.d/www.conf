;;;;;;;;;;;;;;;;;;;;;
; FPM Configuration ;
;;;;;;;;;;;;;;;;;;;;;

[global]
daemonize = no
pid = /run/php/php85-fpm.pid
; Rotated by the logrotate service, which asks the FPM master to reopen it.
error_log = /tmp/php_error.log
log_level = warning

[www]
listen = /run/php/php85-fpm.sock
; PHP-FPM runs as the selected numeric UID:GID and owns the socket it creates.
listen.mode = 0660
pm = dynamic
pm.max_children = 15
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 6
; The fork forces its origin guard after config.local.php in both HTTP authentication modes.
env[RU_HTTP_AUTH] = $HTTP_AUTH
; Explicit public URL for deployments whose proxy rewrites Host or mount prefix.
env[RU_PUBLIC_URL] = $RU_PUBLIC_URL
; clear_env stays enabled; only the documented runtime values reach workers.
env[PATH] = /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
; PHP 8.5 deprecates deriving argv from a web request's query string. With it
; enabled every request raised E_DEPRECATED and replaced error_get_last(),
; hiding PHP's own warnings. The CLI always receives $argv for plugin workers.
php_admin_value[register_argc_argv] = Off

; This pool cannot be exhausted by legitimate long WebUI or plugin requests.
; It runs the same root-owned health script and loads the actual operator config.
[health]
listen = /run/php/php85-health.sock
listen.mode = 0660
pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 10s
pm.max_requests = 1000
env[RU_HTTP_AUTH] = $HTTP_AUTH
; Explicit public URL for deployments whose proxy rewrites Host or mount prefix.
env[RU_PUBLIC_URL] = $RU_PUBLIC_URL
env[PATH] = /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
php_admin_value[register_argc_argv] = Off
