;;;;;;;;;;;;;;;;;;;;;
; FPM Configuration ;
;;;;;;;;;;;;;;;;;;;;;

[global]
daemonize = no
pid = /run/php/php85-fpm.pid
; Rotated by the logrotate service, which asks the FPM master to reopen it.
error_log = /tmp/php_error.log
log_level = warning

[www]
listen = /run/php/php85-fpm.sock
; PHP-FPM runs as the selected numeric UID:GID and owns the socket it creates.
listen.mode = 0660
pm = dynamic
pm.max_children = 15
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 6
; The fork forces its origin guard after config.local.php when Basic auth is active.
env[RU_HTTP_AUTH] = $HTTP_AUTH
; clear_env stays enabled; only the documented runtime values reach workers.
env[PATH] = /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
