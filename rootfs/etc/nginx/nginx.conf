daemon off;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /tmp/nginx-error.log error;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/http-host-policy.conf;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # nginx supplies these headers consistently for PHP, static files and errors.
  # Every FastCGI location inherits this one set; none may declare its own.
  fastcgi_hide_header X-Frame-Options;
  fastcgi_hide_header X-Content-Type-Options;
  fastcgi_hide_header Referrer-Policy;
  fastcgi_hide_header X-XSS-Protection;

  # WebUI upload results use same-origin iframes; preserve an application's
  # stricter DENY while supplying one consistent header for static/error pages.
  map $upstream_http_x_frame_options $rutorrent_frame_options {
    ~*^DENY$ DENY;
    default SAMEORIGIN;
  }
  # Admitted requests use the standard combined access log format. A request
  # whose Host is not admitted keeps those fields and appends one quoted
  # diagnostic field: the 421 for an unlisted name and, with HTTP_AUTH=false,
  # also nginx's own 400 for a missing or malformed Host.
  map $rutorrent_host_allowed $rutorrent_host_rejected {
    0 1;
    default 0;
  }
  log_format rutorrent_host_rejected '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
    '"host-rejected-configure-HTTP_ALLOWED_HOSTS"';

  fastcgi_temp_path /tmp/fastcgi 1 2;
  client_body_temp_path /tmp/client_body 1 2;
  proxy_temp_path /tmp/proxy 1 2;
  uwsgi_temp_path /tmp/uwsgi 1 2;
  scgi_temp_path /tmp/scgi 1 2;

  sendfile on;
  keepalive_timeout 15;
  keepalive_requests 100;
  tcp_nopush on;
  tcp_nodelay off;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_buffers 4 8k;
  gzip_proxied any;
  gzip_vary on;
  gzip_disable "msie6";
  gzip_types
    text/css
    text/javascript
    text/xml
    text/plain
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/vnd.ms-fontobject
    image/svg+xml;

  server {
    server_name _;
    listen 8080 default_server;

    if ($rutorrent_host_allowed = 0) { return 421; }
    # The refusal names the setting without echoing the requested Host. A named
    # location skips the server rewrite phase, so this cannot loop.
    error_page 421 @rutorrent_host_refused;
    location @rutorrent_host_refused {
      default_type text/plain;
      return 421 "Host name not allowed: with HTTP_AUTH=false, recreate the container with this DNS name in HTTP_ALLOWED_HOSTS.\n";
    }

    charset utf-8;
    index index.html;
    root /rutorrent/app;
    # Keep paired with post_max_size in /etc/php85/conf.d/www.ini.
    client_max_body_size 100m;

    add_header X-Frame-Options $rutorrent_frame_options always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    <auth>

    location = /healthz {
      auth_basic off;
      allow 127.0.0.1;
      deny all;
      access_log off;
      include /etc/nginx/fastcgi-health.conf;
      fastcgi_param SCRIPT_FILENAME /etc/nginx/healthcheck.php;
    }

    # Plugin bootstrap has side effects. Its trusted entry point is the Unix
    # listener below, rather than a caller's loopback address or Authorization.
    location = /healthz-plugins {
      deny all;
    }

    location = / { expires -1; }
    location = /index.html { expires -1; }

    location = /favicon.ico {
      access_log off;
      log_not_found off;
    }

    # Repository tooling (tools/, or tasks/ on older refs) and test fixtures
    # ship with the checkout for docker exec and image smoke tests. Keep them
    # outside the HTTP surface, including their PHP scripts.
    location ~ ^/(conf|share|tasks|tests|tools)(/|$) {
      deny all;
    }

    location ~ (^|/)\. {
      deny all;
    }

    location ~* \.(inc|c|h|ini|neon|sh)$ {
      deny all;
    }

    # These bundled workers are CLI entry points, not plugin HTTP endpoints.
    # Keep this explicit so independent third-party plugins remain compatible.
    include /etc/nginx/cli-only.conf;

    # Never let FPM recover an earlier PHP filename from a PATH_INFO suffix.
    location ~ \.php/ {
      return 404;
    }

    <rpc2>

    location ~ ^/(php|plugins)/.+\.php$ {
      try_files $uri =404;
      include /etc/nginx/fastcgi-runtime.conf;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ \.php$ { return 404; }

    # A fork commit can change code without changing ruTorrent's ?v= value.
    location ~* \.(css|js|map)$ {
      expires -1;
      access_log off;
    }

    location ~* \.(jpg|jpeg|gif|png|woff|woff2|ttf|svg|eot)$ {
      expires 30d;
      access_log off;
    }

    access_log /tmp/nginx-rutorrent-access.log combined if=$rutorrent_host_allowed;
    access_log /tmp/nginx-rutorrent-access.log rutorrent_host_rejected if=$rutorrent_host_rejected;
    error_log /tmp/nginx-rutorrent-error.log error;
  }

  # startup keeps /run/nginx private to the selected service UID. This socket
  # is available to the schedule service, but never to an HTTP reverse proxy.
  server {
    listen unix:/run/nginx/plugin-health.sock;
    server_name localhost;
    root /rutorrent/app;
    access_log off;
    error_log /tmp/nginx-rutorrent-error.log error;

    location = /healthz-plugins {
      if ($request_method != GET) { return 405; }
      include /etc/nginx/fastcgi-runtime.conf;
      fastcgi_pass_request_headers off;
      fastcgi_param HTTP_AUTHORIZATION "";
      fastcgi_param REMOTE_USER "";
      fastcgi_param SCRIPT_FILENAME $document_root/php/getplugins.php;
      fastcgi_param SCRIPT_NAME /php/getplugins.php;
      fastcgi_param REQUEST_URI /php/getplugins.php;
      fastcgi_param RUTORRENT_INTERNAL_PLUGIN_HEALTH 1;
    }

    location / { return 404; }
  }
}
