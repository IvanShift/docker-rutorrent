# The browser, internal bootstrap and XML-RPC routes share one FPM policy.
include /etc/nginx/fastcgi_params;
fastcgi_connect_timeout 60s;
fastcgi_send_timeout 300s;
fastcgi_read_timeout 300s;
fastcgi_pass unix:/run/php/php85-fpm.sock;

# Response header ownership is set once at the http level in nginx.conf.
