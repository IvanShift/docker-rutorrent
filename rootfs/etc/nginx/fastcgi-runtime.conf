# The browser, internal bootstrap and XML-RPC routes share one FPM policy.
include /etc/nginx/fastcgi_params;
fastcgi_connect_timeout 60s;
fastcgi_send_timeout 300s;
fastcgi_read_timeout 300s;
fastcgi_pass unix:/run/php/php85-fpm.sock;

# nginx supplies these headers consistently for PHP, static files and errors.
fastcgi_hide_header X-Frame-Options;
fastcgi_hide_header X-Content-Type-Options;
fastcgi_hide_header Referrer-Policy;
fastcgi_hide_header X-XSS-Protection;
