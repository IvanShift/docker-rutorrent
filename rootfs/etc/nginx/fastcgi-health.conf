# A dedicated pool keeps readiness independent of ordinary request saturation.
include /etc/nginx/fastcgi_params;
fastcgi_connect_timeout 1s;
fastcgi_send_timeout 2s;
fastcgi_read_timeout 2s;
fastcgi_pass unix:/run/php/php85-health.sock;
fastcgi_hide_header X-Frame-Options;
fastcgi_hide_header X-Content-Type-Options;
fastcgi_hide_header Referrer-Policy;
fastcgi_hide_header X-XSS-Protection;
