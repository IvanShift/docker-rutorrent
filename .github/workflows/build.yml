name: build

on:
  schedule:
    - cron: '15 23 * * 5'
  push:
    branches: [ "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request keeps one group per ref, and its newer run supersedes the older
# one. Every other run gets a group of its own event, ref and commit: GitHub
# keeps one pending run per group and cancels it for the next arrival, so a
# schedule, a manual run or a re-run of an older commit must never share a
# group with a pending push to master.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}${{ github.event_name != 'pull_request' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ivanshift/rutorrent

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build_date: ${{ steps.prepare.outputs.build_date }}
      tag_date: ${{ steps.prepare.outputs.tag_date }}
      rtorrent_label: ${{ steps.prepare.outputs.rtorrent_label }}
      geolite_version: ${{ steps.geolite.outputs.geolite_version }}
      geolite_sha256: ${{ steps.geolite.outputs.geolite_sha256 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run CI unit tests
        run: python3 -m unittest discover -s tests/ci -p 'test_*.py'

      - name: Read immutable Dockerfile source inputs
        id: prepare
        run: python3 scripts/prepare_ci_inputs.py Dockerfile

      - name: Require successful checks for the pinned ruTorrent commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUTORRENT_REPO_SLUG: ${{ steps.prepare.outputs.rutorrent_repo_slug }}
          RUTORRENT_COMMIT: ${{ steps.prepare.outputs.rutorrent_commit }}
        run: python3 scripts/verify_rutorrent_checks.py "$RUTORRENT_COMMIT" --repo "$RUTORRENT_REPO_SLUG"

      - name: Verify current GeoLite2 Country release
        id: geolite
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/resolve_geolite_ci.py

  validate:
    needs: prepare
    # pidfd tests require the host kernel and the task's real PID. QEMU user-mode
    # cannot satisfy that contract; every candidate runs on its native architecture.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        flavor: [default, filebot]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      CANDIDATE_IMAGE: ivanshift/rutorrent:validation-${{ matrix.flavor }}-${{ matrix.arch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Require native architecture and check shell entry points
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$ARCH:$(uname -m)" in amd64:x86_64|arm64:aarch64) ;; *) echo 'Native smoke runner architecture mismatch' >&2; exit 1;; esac
          tests/shell/run.sh
          mkdir -p "$RUNNER_TEMP/candidate"

      - name: Install OCI archive transfer utility
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes skopeo

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the candidate once
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=oci,dest=${{ runner.temp }}/candidate/image.tar
          # A single OCI manifest is retained byte for byte for publication.
          provenance: false
          sbom: false
          push: false
          build-args: |
            FILEBOT=${{ matrix.flavor == 'filebot' }}
            GEOIP2_DB_VERSION=${{ needs.prepare.outputs.geolite_version }}
            GEOIP2_DB_SHA256=${{ needs.prepare.outputs.geolite_sha256 }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
            VCS_REF=${{ github.sha }}
          tags: ${{ env.CANDIDATE_IMAGE }}
          # Refresh runtime APK packages on every event; cache source and native builds.
          no-cache-filters: runtime
          cache-from: type=gha,scope=candidate-${{ matrix.flavor }}-${{ matrix.arch }}
          cache-to: type=gha,scope=candidate-${{ matrix.flavor }}-${{ matrix.arch }},mode=max

      - name: Import and record the exact candidate for testing
        env:
          FLAVOR: ${{ matrix.flavor }}
          ARCH: ${{ matrix.arch }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/candidate/image.tar"
          python3 scripts/ci_image_artifact.py record "$archive" "$RUNNER_TEMP/candidate/metadata.json" "$FLAVOR" "$ARCH" "$REVISION"
          skopeo --override-arch "$ARCH" copy "oci-archive:$archive" "docker-daemon:$CANDIDATE_IMAGE"
          # Docker stores differ in their image-ID semantics. Verify the actual
          # imported config and ordered rootfs, retaining the OCI publication manifest.
          docker image save "$CANDIDATE_IMAGE" | python3 scripts/ci_image_artifact.py verify-import \
            "$archive" "$RUNNER_TEMP/candidate/metadata.json" "$FLAVOR" "$ARCH" "$REVISION" --image "$CANDIDATE_IMAGE"

      - name: Run update-config checks on every candidate
        run: |
          docker run --pull=never --rm --entrypoint /bin/sh \
            --mount "type=bind,src=${PWD}/tests/update-config,dst=/tests/update-config,readonly" \
            "$CANDIDATE_IMAGE" /tests/update-config/run.sh
          tests/update-config/single-file-mounts.sh "$CANDIDATE_IMAGE"

      - name: Run migration entry-point signal regressions
        if: matrix.flavor == 'default' && matrix.arch == 'amd64'
        run: tests/update-config/signals.sh "$CANDIDATE_IMAGE"

      - name: Run full default startup and native smoke tests
        if: matrix.flavor == 'default'
        run: tests/smoke/default.sh "$CANDIDATE_IMAGE"

      - name: Run startup, FPM rename and retracker metadata regressions
        if: matrix.flavor == 'default'
        run: |
          tests/smoke/startup-regressions.sh "$CANDIDATE_IMAGE"
          tests/smoke/stop-untied.sh "$CANDIDATE_IMAGE"
          tests/smoke/log-rotation.sh "$CANDIDATE_IMAGE"
          tests/smoke/erasedata-fpm-rename.sh "$CANDIDATE_IMAGE"
          tests/smoke/retrackers-metadata.sh "$CANDIDATE_IMAGE" native

      - name: Run offline repair, runtime contract, frame-header and unauthenticated watchdog regressions
        if: matrix.flavor == 'default'
        run: |
          # Executes the README repair command against the startup attestation list.
          tests/smoke/upgrade-permissions.sh "$CANDIDATE_IMAGE"
          # Named GID, access-log format, FPM argv/upload limits and monitor refusals.
          tests/smoke/runtime-contracts.sh "$CANDIDATE_IMAGE"
          # Browser-free scope: X-Frame-Options values, then HTTP_AUTH=false watchdog.
          python3 tests/smoke/http-runtime.py "$CANDIDATE_IMAGE" --scope watchdog

      - name: Run FileBot startup and native smoke tests
        if: matrix.flavor == 'filebot'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          tests/smoke/filebot.sh "$CANDIDATE_IMAGE"
          tests/smoke/pidfd.sh "$CANDIDATE_IMAGE" "linux/$ARCH"
          tests/smoke/erasedata-rename.sh "$CANDIDATE_IMAGE" "linux/$ARCH"

      - name: Retain only the successfully tested candidate
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: candidate-${{ matrix.flavor }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/candidate/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  legacy:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the legacy compatibility image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            RTORRENT_BRANCH=v0.9.8
            RTORRENT_REPO=https://github.com/rakshasa/rtorrent.git
            RTORRENT_REF=6154d1698756e0c4842b1c13a0e56db93f1aa947
            RTORRENT_VERSION=6154d1698756e0c4842b1c13a0e56db93f1aa947
            LIBTORRENT_BRANCH=v0.13.8
            LIBTORRENT_VERSION=756f70010779927dc0691e1e722ed433d5d295e1
            GEOIP2_DB_VERSION=${{ needs.prepare.outputs.geolite_version }}
            GEOIP2_DB_SHA256=${{ needs.prepare.outputs.geolite_sha256 }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
            VCS_REF=${{ github.sha }}
          tags: rutorrent-ci:legacy-098
          no-cache-filters: runtime
          cache-from: type=gha,scope=legacy-amd64
          cache-to: type=gha,scope=legacy-amd64,mode=max

      - name: Run legacy migration and real daemon smoke tests
        run: |
          docker run --pull=never --rm --entrypoint /bin/sh \
            --mount "type=bind,src=${PWD}/tests/update-config,dst=/tests/update-config,readonly" \
            rutorrent-ci:legacy-098 /tests/update-config/legacy-098.sh
          tests/smoke/legacy-098.sh rutorrent-ci:legacy-098
          tests/smoke/stop-untied.sh rutorrent-ci:legacy-098
          tests/smoke/retrackers-metadata.sh rutorrent-ci:legacy-098 legacy
          # The same FPM pools serve the legacy image: pins max_file_uploads=100 there too.
          tests/smoke/runtime-contracts.sh rutorrent-ci:legacy-098

  publish:
    needs: [prepare, validate, legacy]
    if: >-
      success() && (github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Publication never cancels midway through tags. Runs of one commit publish
    # one at a time; a run of another commit cannot displace a pending one. A
    # commit that is no longer master is refused before any release tag moves,
    # and release tags promote this run's own verified digests.
    concurrency:
      group: publish-rutorrent-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download tested candidate archives
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: candidate-*
          path: ${{ runner.temp }}/candidates

      - name: Install OCI archive transfer utility
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes skopeo

      - name: Verify all four retained candidates before registry writes
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          for flavor in default filebot; do
            for arch in amd64 arm64; do
              directory="$RUNNER_TEMP/candidates/candidate-$flavor-$arch"
              python3 scripts/ci_image_artifact.py verify "$directory/image.tar" "$directory/metadata.json" "$flavor" "$arch" "$REVISION"
            done
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Upload candidate manifests without changing their digests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A superseded commit must not even overwrite the staging slots.
          python3 scripts/verify_publish_revision.py "$REVISION" --repo "$REPOSITORY"
          for flavor in default filebot; do
            for arch in amd64 arm64; do
              directory="$RUNNER_TEMP/candidates/candidate-$flavor-$arch"
              # Four internal staging slots are reused across runs; public release
              # tags always promote the digests this run pushed and verified.
              tag="$IMAGE_NAME:candidate-$flavor-$arch"
              skopeo --override-arch "$arch" copy --preserve-digests --retry-times 3 \
                --authfile "$HOME/.docker/config.json" --digestfile "$directory/pushed-digest" \
                "oci-archive:$directory/image.tar" "docker://$tag"
              expected="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["manifest_digest"])' "$directory/metadata.json")"
              test "$(cat "$directory/pushed-digest")" = "$expected"
            done
          done

      - name: Promote the tested platform digests to release tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          RTORRENT_LABEL: ${{ needs.prepare.outputs.rtorrent_label }}
          TAG_DATE: ${{ needs.prepare.outputs.tag_date }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Checked again just before the moving tags change.
          python3 scripts/verify_publish_revision.py "$REVISION" --repo "$REPOSITORY"
          for flavor in default filebot; do
            if [ "$flavor" = default ]; then tag=latest; prefix=rtorrent; else tag=filebot; prefix=filebot-rtorrent; fi
            amd64="$(cat "$RUNNER_TEMP/candidates/candidate-$flavor-amd64/pushed-digest")"
            arm64="$(cat "$RUNNER_TEMP/candidates/candidate-$flavor-arm64/pushed-digest")"
            docker buildx imagetools create \
              --tag "$IMAGE_NAME:$tag" \
              --tag "$IMAGE_NAME:$prefix-$RTORRENT_LABEL" \
              --tag "$IMAGE_NAME:$prefix-$RTORRENT_LABEL-$TAG_DATE-run$RUN_ID-attempt$RUN_ATTEMPT" \
              "$IMAGE_NAME@$amd64" "$IMAGE_NAME@$arm64"
          done
